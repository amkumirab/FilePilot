[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "filepilot-organizer"
version = "0.1.0"
description = "Preview, organize, and undo file moves with configurable rules."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Amir Ali Mirab Zadeh Ardekani"}]
keywords = ["automation", "file-organizer", "cli", "undo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
filepilot = "filepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["filepilot"]
relative_files = true
patch = ["subprocess", "_exit"]

[tool.coverage.report]
show_missing = true
